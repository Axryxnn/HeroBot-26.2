name: Build HeroBot 26.2 Fabric

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Extract HeroBot source
        run: |
          set -euo pipefail
          ARCHIVE="$(find . -maxdepth 1 -type f -name 'HeroBot-26.2-phone-cloud-build.zip' -print -quit)"
          test -n "$ARCHIVE" || { echo "Upload HeroBot-26.2-phone-cloud-build.zip to the repository root."; exit 1; }
          unzip -q "$ARCHIVE" -d .
          test -f HeroBot-26.2-port/gradlew
          chmod +x HeroBot-26.2-port/gradlew

      - name: Build distributable Fabric mod
        working-directory: HeroBot-26.2-port
        run: ./gradlew --no-daemon :herobot-mod:shadowJar

      - name: Verify and upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: HeroBot-Minecraft-26.2-Fabric
          path: HeroBot-26.2-port/herobot-mod/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
